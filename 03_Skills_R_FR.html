<script>
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, START = performance.now() / 1000;
  const rnd = (a, b, c) => { const s = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return s - Math.floor(s); };
  const rep = (c, n) => c.repeat(Math.max(0, n));
  const pad = (s, n) => s.length >= n ? s.slice(0, n) : s + rep(' ', n - s.length);
  const ctr = (s, n) => { if (s.length >= n) return s.slice(0, n); const l = (n - s.length) >> 1; return rep(' ', l) + s + rep(' ', n - l - s.length); };
  const wrap = (s, n) => { const L = []; let c = ''; for (const w of s.split(' ')) { if ((c + ' ' + w).trim().length > n) { L.push(c); c = w; } else c = (c + ' ' + w).trim(); } L.push(c); return L; };
  const box = (w, title, rows) => ['╔═ ' + title + ' ' + rep('═', w - 5 - title.length) + '╗', ...rows.map(r => '║ ' + pad(r, w - 4) + ' ║'), '╚' + rep('═', w - 2) + '╝'];

  /* alphabet 5x7 du titre */
  const F = {
    S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    V: ['#...#', '#...#', '#...#', '#...#', '#...#', '.#.#.', '..#..'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    I: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '#####'],
    R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#']
  };
  const big = (word, sx) => Array.from({ length: 7 }, (_, r) => [...word].map(ch => [...F[ch][r]].map(p => p === '#' ? rep('█', sx) : rep(' ', sx)).join('')).join(' '));

  /* ---- les 3 machines de 03 — SAVOIR-FAIRE (Lettre R) ---- */
  const MACH = [
    {
      id: '01', name: 'LANGUES',
      n: ['FRANÇAIS', 'SLOVAQUE', 'ANGLAIS', 'ITALIEN', 'LATIN'],
      l: ['MATERN.', 'MATERN.', 'C2', 'B2', 'NOTIONS'],
      c: ['natif', 'natif', 'bilingue', 'avancé', 'scolaire'],
      six: [6, 6, 6, 4, 1.5]
    },
    {
      id: '02', name: 'ÉLECTRO & RADIO ON3',
      n: ['PLATINE', 'ÉLECTRICITÉ', 'CIRCUITS RC', 'LOGIQUE NUM', 'KARNAUGH', 'RADIO ON3'],
      l: [5, 4, 4, 5, 4, 5],
      c: ['breadboard', 'générale', 'mesures RC', 'portes/Boole', 'tableaux', 'IBPT 08/22']
    },
    {
      id: '03', name: 'CODE & OUTILS',
      n: ['PYTHON', 'HTML5', 'CSS3', 'JAVASCRIPT', 'EXCEL', 'GEOGEBRA'],
      l: [4, 5, 4, 4, 4, 4],
      c: ['algo & dev', 'web UI', 'styles UI', 'web & sim.', 'form.&data', 'maths 2D']
    }
  ];
  const bar5 = n => '[' + rep('■', n) + rep('·', 5 - n) + ']';
  const lab = (m, k) => typeof m.l[k] === 'number' ? bar5(m.l[k]) : m.l[k];
  const bar6 = lvl => { const fill = Math.round(lvl * 4); let s = '['; for (let c = 0; c < 6; c++) { for (let j = 0; j < 4; j++) s += c * 4 + j < fill ? '■' : '·'; if (c < 5) s += '│'; } return s + ']'; };
  const ST = MACH.map(() => ({ n: 0, seen: new Set(), idx: [0, 0, 0], spin: null, last: -1, leverT: -9, res: null, win: false }));

  function pull(i) {
    const m = MACH[i], s = ST[i], N = m.n.length, now = performance.now() / 1000; if (s.spin) return;
    let tgt; do { tgt = Math.floor(Math.random() * N); } while (tgt === s.last && N > 1);
    const k = RM ? .01 : 1;
    s.n++; s.last = tgt; s.win = false; s.res = null; s.leverT = now;

    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(200,255,255,.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); sg.fillStyle = gr; sg.fillRect(sx, ry, sw, sh * .1);
    sg.fillStyle = 'rgba(0,0,0,.3)'; for (let y = sy; y < sy + sh; y += 3) sg.fillRect(sx, y, sw, 1);
    const rg = sg.createRadialGradient(sx + cx0, sy + sh / 2, sh * .15, sx + cx0, sy + sh / 2, sw * .62);
    rg.addColorStop(0, 'rgba(90,255,220,.08)'); rg.addColorStop(.6, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.65)'); sg.fillStyle = rg; sg.fillRect(sx, sy, sw, sh);
    const gl = sg.createLinearGradient(sx, sy, sx + sw * .55, sy + sh * .55); gl.addColorStop(0, 'rgba(255,255,255,.11)'); gl.addColorStop(.6, 'rgba(255,255,255,0)'); sg.fillStyle = gl; sg.fillRect(sx, sy, sw, sh);

  }
  function drawStage(now, blink) {

    drawSlot(now, blink); drawClaw(now, blink); drawBJ(now, blink);
    if (hover >= 0) { sg.fillStyle = 'rgba(255,255,255,.07)'; sg.fillRect(BOUNDS[hover] * cw, 0, (BOUNDS[hover + 1] - BOUNDS[hover]) * cw, H); }
  }
  const which = e => { const c = (e.clientX - stage.getBoundingClientRect().left) / cw; return c < BOUNDS[1] ? 0 : c < BOUNDS[2] ? 1 : 2; };
  stage.addEventListener('pointermove', e => { hover = which(e); }); stage.addEventListener('pointerleave', () => { hover = -1; });
  stage.addEventListener('click', e => { if (all) { pg++; pgT = burstT = performance.now() / 1000; } else pull(which(e)); });

  let all = false;
  function setAll(v) { all = v; crtT0 = pgT = performance.now() / 1000; G = v ? TVD : D; sizeStage(); stage.hidden = false; rowA.hidden = rowB.hidden = true; tog.textContent = v ? '[ T ] REMETTRE LES MACHINES' : '[ T ] CACHER LES MACHINES · TOUT AFFICHER'; }
  tog.addEventListener('click', () => setAll(!all)); sizeStage(); setAll(innerWidth < 900);
  addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; const k = e.key.toLowerCase(); if (all && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { pg += e.key === 'ArrowRight' ? 1 : 3; pgT = burstT = performance.now() / 1000; } else if (k === 't' || k === 'a') setAll(!all); else if (['1', '2', '3'].includes(k) && !all) pull(+k - 1); });

  let la = 0, lb = 0;
  function frame(ts) {
    const t = ts / 1000, age = RM ? 99 : t - START, blink = RM || ((t * 2) | 0) % 2 === 0;
    if (ts - la > 40) {
      la = ts; base(t, blink).forEach((s, i) => { els[i].textContent = mask(s, age, i); });
      MACH.forEach((m, i) => tick(i, t));
      drawStage(t, blink);
    }
    if (!RM && ts - lb > 100) { lb = ts; bg(t); }
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', () => { size(); sizeStage(); bg(performance.now() / 1000); }); bg(0);
  requestAnimationFrame(frame);

  /* pont molette pour l'iframe zoomable du whiteboard */
  if (window.parent && window.parent !== window) addEventListener('wheel', e => window.parent.postMessage({ type: 'profil-iframe-wheel', deltaY: e.deltaY, clientX: e.clientX, clientY: e.clientY, ctrlKey: e.ctrlKey }, '*'), { passive: true });
})();
